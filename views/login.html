<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Admin · {{clinic_name}}</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="{{logo}}" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(900px 700px at 20% 25%, rgba(47,167,113,0.18), transparent 60%),
      radial-gradient(800px 600px at 80% 75%, rgba(26,58,92,0.30), transparent 60%),
      linear-gradient(135deg, #0a1f2c 0%, #0e2238 100%);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    color: #fff;
  }
  .card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 18px;
    padding: 48px 40px;
    width: 100%; max-width: 420px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .brand img { width: 44px; height: 44px; border-radius: 10px; object-fit: contain; background: #fbfaf6; padding: 2px; }
  .brand strong { display: block; font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.1rem; }
  .brand small { font-size: 0.7rem; color: rgba(255,255,255,0.55); letter-spacing: 0.16em; text-transform: uppercase; }
  h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 1.7rem; margin-bottom: 8px; letter-spacing: -0.02em; }
  .sub { color: rgba(255,255,255,0.6); margin-bottom: 32px; font-size: 0.94rem; }
  label { display: block; font-size: 0.74rem; font-weight: 500; color: rgba(255,255,255,0.7); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  input {
    width: 100%; padding: 13px 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.18);
    color: #fff; font-family: inherit; font-size: 1rem;
    margin-bottom: 22px; transition: border-color .2s;
  }
  input:focus { outline: none; border-bottom-color: #4ade80; }
  button {
    width: 100%; padding: 14px;
    background: #2fa771;
    color: #fff; font-weight: 500; font-size: 0.95rem;
    border: none; border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 12px 30px -10px rgba(47,167,113,0.5);
    transition: all .2s;
    font-family: inherit;
    margin-top: 4px;
  }
  button:hover { background: #1f7d54; transform: translateY(-1px); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .err {
    background: rgba(196,69,69,0.15); border: 1px solid rgba(196,69,69,0.3);
    color: #ffb4b4; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem;
    margin-bottom: 18px; display: none;
  }
  .back { display: block; text-align: center; margin-top: 24px; color: rgba(255,255,255,0.5); font-size: 0.82rem; text-decoration: none; transition: color .2s; }
  .back:hover { color: #fff; }
</style>
</head>
<body>
<form class="card" onsubmit="login(event)">
  <div class="brand">
    <img src="{{logo}}" alt=""/>
    <div>
      <strong>{{clinic_name}} Admin</strong>
      <small>{{clinic_subtitle}}</small>
    </div>
  </div>
  <h1>Sign in</h1>
  <p class="sub">Restricted access. Authorised staff only.</p>
  <div class="err" id="err"></div>
  <label for="u">Username</label>
  <input id="u" type="text" autocomplete="username" required />
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password" required />
  <button type="submit" id="btn">Sign in</button>
  <a class="back" href="/">&larr; Back to website</a>
</form>
<script>
async function login(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('u').value,
        password: document.getElementById('p').value
      })
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || 'Login failed');
    }
    location.href = '{{admin_path}}/dashboard';
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}
</script>
</body>
</html>
